server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Conteúdo em português (acentos) servido como UTF-8
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml application/json;

    # Compressão dos textos/assets
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # HTML sempre revalida (para que updates apareçam sem cache preso)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets estáticos: cache longo e imutável
    location ~* \.(?:css|js|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
