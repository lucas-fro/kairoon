server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Conteúdo em português (acentos) servido como UTF-8
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml application/json;

    # Compressão dos textos/assets
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # HTML sempre revalida (para que updates apareçam sem cache preso)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS têm nome fixo (sem hash), então NÃO podem ser immutable: caso
    # contrário mudanças no CSS/JS não chegam a quem já cacheou o arquivo antigo.
    # no-cache faz revalidar sempre (ETag -> 304 quando nada mudou, barato).
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Imagens e fontes raramente mudam: cache moderado (7 dias, não immutable).
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
