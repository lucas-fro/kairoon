server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # Compressão
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # HTML sempre revalida (deploys aparecem sem cache preso)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets com hash: cache longo e imutável
    location ~* \.(?:css|js|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # API -> backend (mesma rede "web"). O "/" final tira o prefixo /api:
    # /api/auth/login  ->  backend:3333/auth/login
    location /api/ {
        proxy_pass http://kairoon-backend:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a SSE (rotas realtime): sem buffer e sem timeout curto
        proxy_set_header Connection        '';
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_read_timeout                 3600s;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
